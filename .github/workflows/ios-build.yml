name: Build iOS IPA Limpo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Prebuild
        run: npx expo prebuild --platform ios
        env:
          EXPO_OFFLINE: 1

      - name: Setup Xcode Environment
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env
          echo "export EXPO_OFFLINE=1" >> ios/.xcode.env

      - name: Bypass Xcode Code Signing
        run: |
          # Altera as travas de assinatura direto no arquivo de definicao do projeto Xcode
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/*.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/*.xcodeproj/project.pbxproj || true

      - name: Build Local IPA
        run: |
          cd ios
          WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_NAME" .xcworkspace)
          
          xcodebuild -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -quiet \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erro: Aplicativo .app nao encontrado!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r app-puro.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-puro-ipa
          path: app-puro.ipa
